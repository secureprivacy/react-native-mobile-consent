buildscript {
  ext.ReactNativeMobileConsent = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNativeMobileConsent[prop]
  }

  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "ai.secureprivacy.reactnativemobileconsent"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "ai.secureprivacy.sdk:mobile-consent:0.4.10"

  testImplementation "junit:junit:4.13.2"
  testImplementation "io.mockk:mockk:1.13.13"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
  testImplementation "org.jetbrains.kotlin:kotlin-reflect:${getExtOrDefault('kotlinVersion')}"
  // Local unit tests run against a stub android.jar whose org.json classes are no-ops even with
  // returnDefaultValues — every JSON field the bridge returns would silently read back as
  // 0/""/null. Robolectric swaps in a real Android runtime (real org.json included) so response
  // JSON can actually be asserted on.
  testImplementation "org.robolectric:robolectric:4.16.1"
}
